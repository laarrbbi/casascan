# CasaScan en la nube: busca todos los días y te avisa por Telegram de lo nuevo.
#
# - La ejecución diaria está DESACTIVADA hasta que crees la variable de repositorio
#   CASASCAN_ACTIVO = true (Settings → Secrets and variables → Actions → Variables).
#   A mano se puede lanzar siempre desde Actions → bot → Run workflow.
# - Usa config.yaml si lo has subido al repositorio (si no, config.example.yaml).
# - Secretos opcionales (Settings → Secrets and variables → Actions):
#     TELEGRAM_TOKEN, TELEGRAM_CHAT_ID       avisos por Telegram
#     IDEALISTA_API_KEY, IDEALISTA_API_SECRET API oficial de Idealista
# - La memoria (casascan.db) se guarda en la caché de Actions entre ejecuciones,
#   así solo se avisa de lo nuevo. El informe queda en "Artifacts" de cada ejecución.
# - Los servidores de GitHub no están en España: el BOE funciona, pero Idealista y
#   Fotocasa suelen bloquearlos (el bot sigue con el resto y lo indica en el informe).
name: bot

on:
  schedule:
    - cron: "17 6 * * *"   # todos los días a las 06:17 UTC (08:17 en verano en España)
  workflow_dispatch:
    inputs:
      modo:
        description: "buscar = búsqueda normal · diagnostico = prueba cada web y guarda lo que devuelve"
        type: choice
        options: [buscar, diagnostico]
        default: buscar
      fuentes:
        description: "Fuentes separadas por comas (vacío = las de config.yaml)"
        required: false
        default: ""
      provincias:
        description: "Provincias separadas por comas (vacío = las de config.yaml)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: casascan-bot
  cancel-in-progress: false

jobs:
  buscar:
    if: github.event_name == 'workflow_dispatch' || vars.CASASCAN_ACTIVO == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt curl_cffi

      - name: Recuperar la memoria del bot
        uses: actions/cache/restore@v4
        with:
          path: casascan.db
          key: casascan-db-${{ github.run_id }}
          restore-keys: casascan-db-

      - name: Buscar
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IDEALISTA_API_KEY: ${{ secrets.IDEALISTA_API_KEY }}
          IDEALISTA_API_SECRET: ${{ secrets.IDEALISTA_API_SECRET }}
          MODO: ${{ github.event.inputs.modo }}
          FUENTES: ${{ github.event.inputs.fuentes }}
          PROVINCIAS: ${{ github.event.inputs.provincias }}
        run: |
          CFG=config.yaml; [ -f "$CFG" ] || CFG=config.example.yaml
          set -- -c "$CFG"
          if [ -n "$FUENTES" ]; then set -- "$@" --fuentes "$FUENTES"; fi
          if [ -n "$PROVINCIAS" ]; then set -- "$@" --provincias "$PROVINCIAS"; fi
          if [ "$MODO" = "diagnostico" ]; then
            python -m casascan diagnostico "$@"
            exit 0
          fi
          # código 1 = alguna fuente falló (p. ej. bloqueo): no es un fallo del bot
          python -m casascan buscar "$@" || [ $? -eq 1 ]

      - name: Guardar la memoria del bot
        if: always()
        uses: actions/cache/save@v4
        with:
          path: casascan.db
          key: casascan-db-${{ github.run_id }}

      - name: Subir el informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-casascan
          path: |
            resultados/ultimo.*
            resultados/diagnostico_*.zip
          retention-days: 30
